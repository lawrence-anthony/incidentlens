[project]
name = "incidentlens"
version = "0.1.0"
description = "IncidentLens: AI-Powered Data Pipeline Forensics. See beyond the failure."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "openai>=1.40",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
